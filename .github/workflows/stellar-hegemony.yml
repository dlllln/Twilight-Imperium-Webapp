name: Stellar Hegemony

on:
  push:
    paths: ["stellar-hegemony/**", ".github/workflows/stellar-hegemony.yml"]
  pull_request:
    paths: ["stellar-hegemony/**", ".github/workflows/stellar-hegemony.yml"]

defaults:
  run:
    working-directory: stellar-hegemony

jobs:
  check:
    runs-on: ubuntu-latest
    # Echte Dienste für die Adapter-Tests (PostgresEventStore, RedisLobbyStore).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: stellar
          POSTGRES_DB: stellar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stellar" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: stellar-hegemony/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: stellar-hegemony/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://stellar:stellar@localhost:5432/stellar
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - run: pnpm --filter @stellar/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
